name: Linux desktop package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: linux-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Ubuntu 22.04 x64
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Install Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap libfuse2 xvfb xauth fakeroot dpkg-dev \
            libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libxtst6 \
            libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libcups2 libdrm2 \
            libatk1.0-0 libatk-bridge2.0-0 fonts-noto-cjk

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: 'true'

      - name: Build AppImage and deb
        run: pnpm --dir apps/desktop run package:linux:x64:unsigned
        env:
          CI: 'true'
          DSH_GATE_CONCURRENCY: '4'

      - name: Write checksums
        shell: bash
        run: |
          cd apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts
          sha256sum ./*.AppImage ./*.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-linux-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.AppImage
            apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.deb
            apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/SHA256SUMS

      - name: Publish unsigned release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.AppImage
            apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.deb
            apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          fail_on_unmatched_files: true